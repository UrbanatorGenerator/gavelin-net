name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Spec drops and their generated commits are deployed by publish-insight.yml,
    # which would otherwise race this workflow over the same Pages deployment.
    paths-ignore:
      - 'pipeline/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      urls: ${{ steps.changed.outputs.urls }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the sitemap dates pages by their last commit.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - id: changed
        name: Collect URLs changed in this push
        run: |
          # Pages committed on the same day as this push carry that date as lastmod.
          day="$(git log -1 --format=%cs)"
          urls="$(grep -o "<loc>[^<]*</loc><lastmod>${day}" dist/sitemap-0.xml | sed 's#<loc>##; s#</loc>.*##' | tr '\n' ' ')"
          echo "urls=https://gavelin.net/ https://gavelin.net/llms.txt https://gavelin.net/llms-full.txt ${urls}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment

  ping:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Ping IndexNow
        continue-on-error: true
        run: scripts/indexnow.sh ${{ needs.build.outputs.urls }}
