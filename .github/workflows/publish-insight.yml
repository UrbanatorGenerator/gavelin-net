name: Publish insight

# n8n drops a spec into pipeline/incoming/ and this turns it into the sv/en/es
# pages. The build runs before anything is committed, so a bad spec fails here
# instead of breaking the live site.

on:
  push:
    branches: [main]
    paths:
      - 'pipeline/incoming/**.json'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      urls: ${{ steps.generate.outputs.urls }}
      published: ${{ steps.generate.outputs.published }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - id: generate
        name: Generate pages from specs
        run: |
          set -euo pipefail
          shopt -s nullglob
          specs=(pipeline/incoming/*.json)
          if [ ${#specs[@]} -eq 0 ]; then
            echo "no specs to publish"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          all_urls=""
          mkdir -p pipeline/published
          for spec in "${specs[@]}"; do
            echo "::group::$spec"
            result="$(node scripts/new-insight.mjs "$spec")"
            echo "$result"
            urls="$(node -e "console.log(JSON.parse(process.argv[1]).urls.join(' '))" "$result")"
            all_urls="$all_urls $urls"
            git mv "$spec" "pipeline/published/$(basename "$spec")"
            echo "::endgroup::"
          done
          echo "urls=${all_urls# }" >> "$GITHUB_OUTPUT"
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Build (validates the generated pages)
        if: steps.generate.outputs.published == 'true'
        run: npm run build

      - name: Commit and push
        if: steps.generate.outputs.published == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src public pipeline
          git commit -m "Publish insight from LinkedIn newsletter pipeline"
          git push

      - uses: actions/upload-pages-artifact@v5
        if: steps.generate.outputs.published == 'true'
        with:
          path: dist/

  deploy:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment

  ping:
    needs: [publish, deploy]
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Ping IndexNow
        continue-on-error: true
        run: scripts/indexnow.sh ${{ needs.publish.outputs.urls }}
